[package]
name = "sift_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Sift's local search index, ranking engine and URL privacy core"
license = "MIT"

[lib]
name = "sift_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
chrono = { version = "=0.4.38", default-features = false, features = ["std"] }
rust-stemmers = "=1.2.0"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
unicode-normalization = "=0.1.24"
url = "=2.5.2"
