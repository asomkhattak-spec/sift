name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Test the Rust core
        env:
          CARGO_HTTP_TIMEOUT: "600"
          CARGO_HTTP_LOW_SPEED_LIMIT: "1"
          CARGO_NET_RETRY: "10"
        run: cargo test --locked --manifest-path rust/sift_core/Cargo.toml

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Cross-compile the Rust core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash tool/build_rust_android.sh --required

      - name: Resolve Dart packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Dart tests
        run: flutter test --reporter expanded

      - name: Build release APK
        env:
          SIFT_KEYSTORE_BASE64: ${{ secrets.SIFT_KEYSTORE_BASE64 }}
          SIFT_KEYSTORE_PASSWORD: ${{ secrets.SIFT_KEYSTORE_PASSWORD }}
          SIFT_KEY_ALIAS: ${{ secrets.SIFT_KEY_ALIAS }}
          SIFT_KEY_PASSWORD: ${{ secrets.SIFT_KEY_PASSWORD }}
        run: |
          if [ -n "${SIFT_KEYSTORE_BASE64:-}" ]; then
            echo "$SIFT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sift-release.jks"
            echo "SIFT_KEYSTORE_PATH=$RUNNER_TEMP/sift-release.jks" >> "$GITHUB_ENV"
            echo "SIFT_KEYSTORE_PASSWORD=$SIFT_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIFT_KEY_ALIAS=${SIFT_KEY_ALIAS:-sift}" >> "$GITHUB_ENV"
            echo "SIFT_KEY_PASSWORD=${SIFT_KEY_PASSWORD:-$SIFT_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          fi
          flutter build apk --release

      - name: Name the APK after its version
        run: |
          set -euo pipefail
          VERSION_LINE="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)"
          VERSION_NAME="${VERSION_LINE%%+*}"
          if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "$VERSION_LINE" ]; then
            echo "pubspec.yaml needs a version in the form name+code." >&2
            exit 1
          fi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Sift-${VERSION_NAME}.apk"
          echo "SIFT_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          sha256sum "dist/Sift-${VERSION_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sift-apk
          path: dist/Sift-*.apk
          if-no-files-found: error
          retention-days: 30

  screenshots:
    name: Render UI screenshots
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Resolve Dart packages
        run: flutter pub get

      - name: Render screens
        run: |
          flutter test --update-goldens test/visual/render_screens.dart

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sift-screenshots
          path: test/visual/goldens
          if-no-files-found: error
          retention-days: 30

  ota:
    name: Deploy update service
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check for deployment secrets
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vercel secrets are not configured; skipping the update-service deploy."
          fi

      - name: Deploy to Vercel
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@62.1.0 deploy --prod --yes --token "$VERCEL_TOKEN" ota

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: sift-apk
          path: dist

      - name: Build the signed-checksum update manifest
        run: |
          set -euo pipefail
          VERSION_LINE="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)"
          VERSION_NAME="${VERSION_LINE%%+*}"
          VERSION_CODE="${VERSION_LINE##*+}"
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v$VERSION_NAME" ]; then
            echo "Tag $TAG does not match pubspec version $VERSION_LINE." >&2
            exit 1
          fi
          if ! printf '%s' "$VERSION_CODE" | grep -Eq '^[0-9]+$'; then
            echo "The pubspec build number is not an integer." >&2
            exit 1
          fi
          APK="dist/Sift-${VERSION_NAME}.apk"
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$APK")"
          NOTES_FILE="ota/notes-${VERSION_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES="$(cat "$NOTES_FILE")"
          else
            NOTES="Sift ${VERSION_NAME} is available. Search quality, media results, and reliability improvements."
          fi
          jq -n \
            --argjson version_code "$VERSION_CODE" \
            --arg version_name "$VERSION_NAME" \
            --arg tag "$TAG" \
            --arg apk_url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Sift-${VERSION_NAME}.apk" \
            --arg sha256 "$SHA" \
            --argjson size_bytes "$SIZE" \
            --arg notes "$NOTES" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              version_code: $version_code,
              version_name: $version_name,
              tag: $tag,
              apk_url: $apk_url,
              sha256: $sha256,
              size_bytes: $size_bytes,
              notes: $notes,
              published_at: $published_at
            }' > dist/update.json
          jq . dist/update.json

      - name: Attach the APK and manifest to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Sift-*.apk
            dist/update.json
          generate_release_notes: true
          draft: false
          prerelease: false