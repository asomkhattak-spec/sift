name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Test the Rust core
        env:
          CARGO_HTTP_TIMEOUT: "600"
          CARGO_HTTP_LOW_SPEED_LIMIT: "1"
          CARGO_NET_RETRY: "10"
        run: cargo test --locked --manifest-path rust/sift_core/Cargo.toml

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Cross-compile the Rust core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash tool/build_rust_android.sh --required

      - name: Resolve Dart packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Dart tests
        run: flutter test --reporter expanded

      - name: Build release APK
        env:
          SIFT_KEYSTORE_BASE64: ${{ secrets.SIFT_KEYSTORE_BASE64 }}
          SIFT_KEYSTORE_PASSWORD: ${{ secrets.SIFT_KEYSTORE_PASSWORD }}
          SIFT_KEY_ALIAS: ${{ secrets.SIFT_KEY_ALIAS }}
          SIFT_KEY_PASSWORD: ${{ secrets.SIFT_KEY_PASSWORD }}
        run: |
          if [ -n "${SIFT_KEYSTORE_BASE64:-}" ]; then
            echo "$SIFT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sift-release.jks"
            echo "SIFT_KEYSTORE_PATH=$RUNNER_TEMP/sift-release.jks" >> "$GITHUB_ENV"
            echo "SIFT_KEYSTORE_PASSWORD=$SIFT_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIFT_KEY_ALIAS=${SIFT_KEY_ALIAS:-sift}" >> "$GITHUB_ENV"
            echo "SIFT_KEY_PASSWORD=${SIFT_KEY_PASSWORD:-$SIFT_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          fi
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sift-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  screenshots:
    name: Render UI screenshots
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Resolve Dart packages
        run: flutter pub get

      - name: Render screens
        run: |
          flutter test --update-goldens test/visual/render_screens.dart

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sift-screenshots
          path: test/visual/goldens
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: sift-apk
          path: dist

      - name: Attach APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/app-release.apk
          generate_release_notes: true
          draft: false
