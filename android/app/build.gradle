plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"

def keystorePath = System.getenv("SIFT_KEYSTORE_PATH")
def keystorePassword = System.getenv("SIFT_KEYSTORE_PASSWORD")
def keyAlias = System.getenv("SIFT_KEY_ALIAS") ?: "sift"
def keyPassword = System.getenv("SIFT_KEY_PASSWORD") ?: keystorePassword
def hasReleaseKeystore = keystorePath != null &&
        new File(keystorePath).exists() &&
        keystorePassword != null

android {
    namespace "io.github.asomkhattak.sift"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "io.github.asomkhattak.sift"
        minSdk 23
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        release {
            // CI supplies a private keystore. Without it a release build is
            // still installable, signed with the local debug key.
            signingConfig hasReleaseKeystore
                    ? signingConfigs.release
                    : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

flutter {
    source = "../.."
}
